<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="舆图 Chorograph">
  <!-- 山河印：亮色环境=白文（朱底白纹），暗色环境=朱文（红线镂空）——一脊一河 -->
  <style>
    .plate{fill:#b73527}.frame{display:none}.mark{stroke:#fdf3ef}
    @media (prefers-color-scheme: dark){
      .plate{display:none}
      .frame{display:inline;stroke:#dd6047}
      .mark{stroke:#dd6047;stroke-width:8.5}
    }
  </style>
  <rect class="plate" width="100" height="100" rx="24"/>
  <rect class="frame" x="5" y="5" width="90" height="90" rx="21" fill="none" stroke-width="7"/>
  <path class="mark" d="M16 62 L37 30 L51 49 L64 33 L84 62" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="mark" d="M15 78 C27 71 36 85 50 78 C62 72 72 84 85 77" fill="none" stroke-width="8" stroke-linecap="round"/>
</svg>
